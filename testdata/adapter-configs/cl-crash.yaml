
rbac:
   resources:
     - namespaces

adapterConfig:
  yaml:
    adapter:
      name: cl-crash

    debug_config: false
    log:
      level: debug

    clients:
      hyperfleet_api:
        base_url: CHANGE_ME
        version: v1
        timeout: 2s
        retry_attempts: 3
        retry_backoff: exponential

      broker:
        subscription_id: CHANGE_ME
        topic: CHANGE_ME

      kubernetes:
        api_version: "v1"

adapterTaskConfig:
  yaml:
    params:
      - name: "clusterId"
        source: "event.id"
        type: "string"
        required: true
      - name: "runId"
        source: "env.RUN_ID"
        type: "string"
        required: true

      - name: "clusterStatus"
        source:
          api_call:
            method: "GET"
            url: "/clusters/{{ .clusterId }}"
            timeout: 10s
            retry_attempts: 3
            retry_backoff: "exponential"

      - name: "clusterName"
        source: "clusterStatus.name"

      - name: "generationSpec"
        source: "clusterStatus.generation"

      - name: "clusterNotReconciled"
        source:
          expression: |
            clusterStatus.?status.?conditions.orValue([]).filter(c, c.type == "Reconciled").size() > 0
              ? clusterStatus.?status.?conditions.orValue([]).filter(c, c.type == "Reconciled")[0].status != "True"
              : true

      - name: "clusterReconciledTTL"
        source:
          expression: |
            (timestamp(now()) - timestamp(
              clusterStatus.?status.?conditions.orValue([]).filter(c, c.type == "Reconciled").size() > 0
                ? clusterStatus.?status.?conditions.orValue([]).filter(c, c.type == "Reconciled")[0].last_transition_time
                : now()
            )).getSeconds() > 300

    preconditions:
      - name: "validationCheck"
        expression: |
          clusterNotReconciled || clusterReconciledTTL

    resources:
      - name: "clusterNamespace"
        transport:
          client: "kubernetes"
        manifest:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ .clusterId }}-cl-crash"
            labels:
              hyperfleet.io/cluster-id: "{{ .clusterId }}"
              hyperfleet.io/cluster-name: "{{ .clusterName }}"
              e2e.hyperfleet.io/run-id: "{{ .runId }}"
            annotations:
              hyperfleet.io/generation: "{{ .generationSpec }}"
        discovery:
          namespace: "*"
          by_selectors:
            label_selector:
              hyperfleet.io/cluster-id: "{{ .clusterId }}"

    post:
      payloads:
        - name: "clusterStatusPayload"
          build:
            adapter: "{{ .adapter.name }}"
            conditions:
              - type: "Applied"
                status:
                  expression: |
                    resources.?clusterNamespace.?status.?phase.orValue("") == "Active" ? "True" : "False"
                reason:
                  expression: |
                    resources.?clusterNamespace.?status.?phase.orValue("") == "Active"
                      ? "NamespaceCreated"
                      : "NamespacePending"
                message:
                  expression: |
                    resources.?clusterNamespace.?status.?phase.orValue("") == "Active"
                      ? "Namespace created successfully"
                      : "Namespace creation in progress"
              - type: "Available"
                status:
                  expression: |
                    resources.?clusterNamespace.?status.?phase.orValue("") == "Active" ? "True" : "False"
                reason:
                  expression: |
                    resources.?clusterNamespace.?status.?phase.orValue("") == "Active" ? "NamespaceReady" : "NamespaceNotReady"
                message:
                  expression: |
                    resources.?clusterNamespace.?status.?phase.orValue("") == "Active" ? "Namespace is active and ready" : "Namespace is not active and ready"
              - type: "Health"
                status:
                  expression: |
                    adapter.?executionStatus.orValue("") == "success" ? "True" : "False"
                reason:
                  expression: |
                    adapter.?errorReason.orValue("") != "" ? adapter.?errorReason.orValue("") : "Healthy"
                message:
                  expression: |
                    adapter.?errorMessage.orValue("") != "" ? adapter.?errorMessage.orValue("") : "All adapter operations in progress or completed successfully"
            observed_generation:
              expression: "generationSpec"
            observed_time: "{{ now | date \"2006-01-02T15:04:05Z07:00\" }}"

      post_actions:
        - name: "reportClusterStatus"
          api_call:
            method: "PUT"
            url: "/clusters/{{ .clusterId }}/statuses"
            headers:
              - name: "Content-Type"
                value: "application/json"
            body: "{{ .clusterStatusPayload }}"
