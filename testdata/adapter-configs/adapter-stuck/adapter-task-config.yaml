# Stuck role for the fixture kinds, derived from cl-stuck. The behavior is a
# healthy success role; the test scales the deployment to zero before deleting
# the resource, so nothing reports Finalized and the API cannot hard-delete it.

schema_version: "2.0"

params:
  - name: "resourceId"
    source: "event.id"
    type: "string"
    required: true

  # Required like the success role: a role that cannot address the resource must
  # fail loudly rather than guess a plural-specific URL.
  - name: "href"
    source: "event.href"
    type: "string"
    required: true

  - name: "runId"
    source: "env.RUN_ID"
    type: "string"
    required: true

  - name: "ci"
    source: "env.CI"
    type: "string"
    required: false
    default: "false"

  - name: "resourceStatus"
    source:
      api_call:
        method: "GET"
        url: "{{ .href }}"
        timeout: 10s
        retry_attempts: 3
        retry_backoff: "exponential"

  - name: "resourceName"
    source: "resourceStatus.name"

  - name: "generationSpec"
    source: "resourceStatus.generation"

  - name: "is_deleting"
    source:
      expression: "resourceStatus.?deleted_time.hasValue()"

  - name: "notReconciled"
    source:
      expression: |
        resourceStatus.?status.?conditions.orValue([]).filter(c, c.type == "Reconciled").size() > 0
          ? resourceStatus.?status.?conditions.orValue([]).filter(c, c.type == "Reconciled")[0].status != "True"
          : true

  - name: "selfHealDue"
    source:
      expression: |
        (timestamp(now()) - timestamp(
          resourceStatus.?status.?conditions.orValue([]).filter(c, c.type == "Reconciled").size() > 0
            ? resourceStatus.?status.?conditions.orValue([]).filter(c, c.type == "Reconciled")[0].last_transition_time
            : now()
        )).getSeconds() > (is_deleting ? 15 : 300)

# The is_deleting guard keeps the role active while the resource is being
# deleted. Without it a role deployed alongside a success adapter would be
# skipped on an already-reconciled resource instead of doing its work.
preconditions:
  - name: "validationCheck"
    expression: |
      is_deleting || notReconciled || selfHealDue

resources:
  - name: "resourceNamespace"
    manifest:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ .adapter.name }}-{{ .resourceId }}"
        labels:
          hyperfleet.io/resource-id: "{{ .resourceId }}"
          hyperfleet.io/resource-name: "{{ .resourceName }}"
          e2e.hyperfleet.io/adapter: "{{ .adapter.name }}"
          e2e.hyperfleet.io/ci: "{{ .ci }}"
          e2e.hyperfleet.io/managed-by: "test-framework"
          e2e.hyperfleet.io/run-id: "{{ .runId }}"
        annotations:
          hyperfleet.io/generation: "{{ .generationSpec }}"
    discovery:
      namespace: "*"
      by_selectors:
        label_selector:
          hyperfleet.io/resource-id: "{{ .resourceId }}"
          hyperfleet.io/resource-name: "{{ .resourceName }}"
          e2e.hyperfleet.io/adapter: "{{ .adapter.name }}"
    lifecycle:
      delete:
        propagationPolicy: Foreground
        when:
          expression: "is_deleting"

post:
  payloads:
    - name: "resourceStatusPayload"
      build:
        adapter: "{{ .adapter.name }}"
        conditions:
          - type: "Applied"
            status:
              expression: |
                resources.?resourceNamespace.?status.?phase.orValue("") == "Active" ? "True" : "False"
            reason:
              expression: |
                resources.?resourceNamespace.?status.?phase.orValue("") == "Active"
                  ? "NamespaceCreated"
                  : "NamespacePending"
            message:
              expression: |
                resources.?resourceNamespace.?status.?phase.orValue("") == "Active"
                  ? "Namespace created successfully"
                  : "Namespace creation in progress"
          - type: "Available"
            status:
              expression: |
                resources.?resourceNamespace.?status.?phase.orValue("") == "Active" ? "True" : "False"
            reason:
              expression: |
                resources.?resourceNamespace.?status.?phase.orValue("") == "Active" ? "NamespaceReady" : "NamespaceNotReady"
            message:
              expression: |
                resources.?resourceNamespace.?status.?phase.orValue("") == "Active"
                  ? "Namespace is active and ready"
                  : "Namespace is not active and ready"
          - type: "Health"
            status:
              expression: |
                adapter.?executionStatus.orValue("") == "success"
                  && !adapter.?resourcesSkipped.orValue(false)
                ? "True"
                : "False"
            reason:
              expression: |
                adapter.?executionStatus.orValue("") != "success"
                  ? "ExecutionFailed:" + adapter.?executionError.?phase.orValue("unknown")
                  : adapter.?resourcesSkipped.orValue(false)
                    ? "ResourcesSkipped"
                    : "Healthy"
            message:
              expression: |
                adapter.?executionStatus.orValue("") != "success"
                  ? "Adapter failed at phase ["
                      + adapter.?executionError.?phase.orValue("unknown")
                      + "] step ["
                      + adapter.?executionError.?step.orValue("unknown")
                      + "]: "
                      + adapter.?executionError.?message.orValue(adapter.?errorMessage.orValue("no details"))
                  : adapter.?resourcesSkipped.orValue(false)
                    ? "Resources skipped: " + adapter.?skipReason.orValue("unknown reason")
                    : "Adapter execution completed successfully"
          # The status requires a successful execution, so the reason and message
          # branch on the same inputs instead of reporting CleanupConfirmed while
          # the run failed.
          - type: "Finalized"
            status:
              expression: |
                is_deleting
                  && adapter.?executionStatus.orValue("") == "success"
                  && !adapter.?resourcesSkipped.orValue(false)
                  && !resources.?resourceNamespace.hasValue()
                ? "True"
                : "False"
            reason:
              expression: |
                !is_deleting
                  ? "NotDeleting"
                  : adapter.?executionStatus.orValue("") != "success"
                    ? "ExecutionFailed:" + adapter.?executionError.?phase.orValue("unknown")
                    : adapter.?resourcesSkipped.orValue(false)
                      ? "ResourcesSkipped"
                      : !resources.?resourceNamespace.hasValue()
                        ? "CleanupConfirmed"
                        : "CleanupInProgress"
            message:
              expression: |
                !is_deleting
                  ? "Resource not marked for deletion"
                  : adapter.?executionStatus.orValue("") != "success"
                    ? "Adapter failed at phase ["
                        + adapter.?executionError.?phase.orValue("unknown")
                        + "] step ["
                        + adapter.?executionError.?step.orValue("unknown")
                        + "]: "
                        + adapter.?executionError.?message.orValue(adapter.?errorMessage.orValue("no details"))
                    : adapter.?resourcesSkipped.orValue(false)
                      ? "Resources skipped: " + adapter.?skipReason.orValue("unknown reason")
                      : !resources.?resourceNamespace.hasValue()
                        ? "All resources deleted; cleanup confirmed"
                        : "Deletion in progress; waiting for namespace to be removed"
        observed_generation:
          expression: "generationSpec"
        observed_time: "{{ now | date \"2006-01-02T15:04:05Z07:00\" }}"

  post_actions:
    - name: "reportResourceStatus"
      api_call:
        method: "PUT"
        url: "{{ .href }}/statuses"
        headers:
          - name: "Content-Type"
            value: "application/json"
        body: "{{ .resourceStatusPayload }}"
