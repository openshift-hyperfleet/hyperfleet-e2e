# Invalid-resource role for the fixture kinds, derived from cl-invalid-resource.
# The ConfigMap name violates DNS-1123, so the API server rejects it in the
# resources phase. internal/executor continues to post actions after a resource
# failure, so this role does report status — which makes it the only role that
# can exercise the ExecutionFailed branch of the Finalized condition.
#
# The ConfigMap targets the resource namespace the success role creates, the same
# way cl-invalid-resource targets the namespace cl-namespace creates. Deploy this
# role alongside the success role so the rejection is the invalid name and not a
# missing namespace.
#
# The ConfigMap deliberately has no lifecycle.delete gate. A resource without one
# is applied again while the resource is being deleted, so this role keeps failing
# and Finalized stays False with ExecutionFailed:resources. That is the condition
# cl-invalid-resource produces on a Cluster, which HYPERFLEET-1729 asks this role
# to reproduce; a delete gate would make the role report Finalized=True and drop
# that coverage. A journey that needs the hard delete to finish undeploys it.

schema_version: "2.0"

params:
  - name: "resourceId"
    source: "event.id"
    type: "string"
    required: true

  # Required like the success role: a role that cannot address the resource must
  # fail loudly rather than guess a plural-specific URL.
  - name: "href"
    source: "event.href"
    type: "string"
    required: true

  - name: "runId"
    source: "env.RUN_ID"
    type: "string"
    required: true

  - name: "ci"
    source: "env.CI"
    type: "string"
    required: false
    default: "false"

  - name: "resourceStatus"
    source:
      api_call:
        method: "GET"
        url: "{{ .href }}"
        timeout: 10s
        retry_attempts: 3
        retry_backoff: "exponential"

  - name: "resourceName"
    source: "resourceStatus.name"

  - name: "generationSpec"
    source: "resourceStatus.generation"

  - name: "is_deleting"
    source:
      expression: "resourceStatus.?deleted_time.hasValue()"

  - name: "notReconciled"
    source:
      expression: |
        resourceStatus.?status.?conditions.orValue([]).filter(c, c.type == "Reconciled").size() > 0
          ? resourceStatus.?status.?conditions.orValue([]).filter(c, c.type == "Reconciled")[0].status != "True"
          : true

  - name: "selfHealDue"
    source:
      expression: |
        (timestamp(now()) - timestamp(
          resourceStatus.?status.?conditions.orValue([]).filter(c, c.type == "Reconciled").size() > 0
            ? resourceStatus.?status.?conditions.orValue([]).filter(c, c.type == "Reconciled")[0].last_transition_time
            : now()
        )).getSeconds() > (is_deleting ? 15 : 300)

# The is_deleting guard keeps the role active while the resource is being
# deleted. Without it a role deployed alongside a success adapter would be
# skipped on an already-reconciled resource instead of doing its work.
preconditions:
  - name: "validationCheck"
    expression: |
      is_deleting || notReconciled || selfHealDue

resources:
  - name: "invalidConfigMap"
    manifest:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        # Invalid name: uppercase letters violate DNS-1123 subdomain rules.
        name: "INVALID-NAME-{{ .resourceId }}"
        namespace: "{{ .resourceId }}"
        labels:
          hyperfleet.io/resource-id: "{{ .resourceId }}"
          hyperfleet.io/resource-name: "{{ .resourceName }}"
          e2e.hyperfleet.io/ci: "{{ .ci }}"
          e2e.hyperfleet.io/managed-by: "test-framework"
          e2e.hyperfleet.io/run-id: "{{ .runId }}"
        annotations:
          hyperfleet.io/generation: "{{ .generationSpec }}"
      data:
        test-key: "test-value"
    discovery:
      namespace: "{{ .resourceId }}"
      by_selectors:
        label_selector:
          hyperfleet.io/resource-id: "{{ .resourceId }}"

post:
  payloads:
    - name: "resourceStatusPayload"
      build:
        adapter: "{{ .adapter.name }}"
        conditions:
          - type: "Applied"
            status:
              expression: |
                resources.?invalidConfigMap.?metadata.?name.orValue("") != "" ? "True" : "False"
            reason:
              expression: |
                resources.?invalidConfigMap.?metadata.?name.orValue("") != ""
                  ? "ResourceCreated"
                  : "ResourceFailed"
            message:
              expression: |
                resources.?invalidConfigMap.?metadata.?name.orValue("") != ""
                  ? "ConfigMap created successfully"
                  : "ConfigMap creation failed"
          - type: "Available"
            status:
              expression: |
                resources.?invalidConfigMap.?metadata.?name.orValue("") != "" ? "True" : "False"
            reason:
              expression: |
                resources.?invalidConfigMap.?metadata.?name.orValue("") != ""
                  ? "ResourceReady"
                  : "ResourceNotReady"
            message:
              expression: |
                resources.?invalidConfigMap.?metadata.?name.orValue("") != ""
                  ? "ConfigMap is ready"
                  : "ConfigMap is not ready"
          - type: "Health"
            status:
              expression: |
                adapter.?executionStatus.orValue("") == "success"
                  && !adapter.?resourcesSkipped.orValue(false)
                ? "True"
                : "False"
            reason:
              expression: |
                adapter.?executionStatus.orValue("") != "success"
                  ? "ExecutionFailed:" + adapter.?executionError.?phase.orValue("unknown")
                  : adapter.?resourcesSkipped.orValue(false)
                    ? "ResourcesSkipped"
                    : "Healthy"
            message:
              expression: |
                adapter.?executionStatus.orValue("") != "success"
                  ? "Adapter failed at phase ["
                      + adapter.?executionError.?phase.orValue("unknown")
                      + "] step ["
                      + adapter.?executionError.?step.orValue("unknown")
                      + "]: "
                      + adapter.?executionError.?message.orValue(adapter.?errorMessage.orValue("no details"))
                  : adapter.?resourcesSkipped.orValue(false)
                    ? "Resources skipped: " + adapter.?skipReason.orValue("unknown reason")
                    : "Adapter execution completed successfully"
          # The status requires a successful execution, so the reason and message
          # branch on the same inputs instead of reporting CleanupConfirmed while
          # the run failed.
          - type: "Finalized"
            status:
              expression: |
                is_deleting
                  && adapter.?executionStatus.orValue("") == "success"
                  && !adapter.?resourcesSkipped.orValue(false)
                  && !resources.?invalidConfigMap.hasValue()
                ? "True"
                : "False"
            reason:
              expression: |
                !is_deleting
                  ? "NotDeleting"
                  : adapter.?executionStatus.orValue("") != "success"
                    ? "ExecutionFailed:" + adapter.?executionError.?phase.orValue("unknown")
                    : adapter.?resourcesSkipped.orValue(false)
                      ? "ResourcesSkipped"
                      : !resources.?invalidConfigMap.hasValue()
                        ? "CleanupConfirmed"
                        : "CleanupInProgress"
            message:
              expression: |
                !is_deleting
                  ? "Resource not marked for deletion"
                  : adapter.?executionStatus.orValue("") != "success"
                    ? "Adapter failed at phase ["
                        + adapter.?executionError.?phase.orValue("unknown")
                        + "] step ["
                        + adapter.?executionError.?step.orValue("unknown")
                        + "]: "
                        + adapter.?executionError.?message.orValue(adapter.?errorMessage.orValue("no details"))
                    : adapter.?resourcesSkipped.orValue(false)
                      ? "Resources skipped: " + adapter.?skipReason.orValue("unknown reason")
                      : !resources.?invalidConfigMap.hasValue()
                        ? "All resources deleted; cleanup confirmed"
                        : "Deletion in progress; waiting for namespace to be removed"
        observed_generation:
          expression: "generationSpec"
        observed_time: "{{ now | date \"2006-01-02T15:04:05Z07:00\" }}"

  post_actions:
    - name: "reportResourceStatus"
      api_call:
        method: "PUT"
        url: "{{ .href }}/statuses"
        headers:
          - name: "Content-Type"
            value: "application/json"
        body: "{{ .resourceStatusPayload }}"
