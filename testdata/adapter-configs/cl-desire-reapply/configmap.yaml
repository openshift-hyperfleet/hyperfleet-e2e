apiVersion: v1
kind: ConfigMap
metadata:
  name: reapply-config
  namespace: "{{ .resourceId }}-reapply"
  labels:
    hyperfleet.io/cluster-id: "{{ .resourceId }}"
    e2e.hyperfleet.io/run-id: "{{ .runId }}"
  annotations:
    hyperfleet.io/generation: "{{ .generation }}"
data:
  cluster_id: "{{ .resourceId }}"
