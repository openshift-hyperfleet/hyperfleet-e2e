# HyperFleet E2E - golangci-lint configuration
# Aligned with: https://github.com/openshift-hyperfleet/architecture/blob/main/hyperfleet/standards/golangci.yml

version: "2"

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

linters:
  enable:
    # Code Quality
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - unconvert
    - unparam
    - goconst
    - exhaustive

    # Code Style
    - misspell
    - lll
    - revive
    - gocritic

    # Security
    - gosec
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    govet:
      enable-all: true
    goconst:
      min-len: 3
      min-occurrences: 3
    misspell:
      locale: US
    lll:
      line-length: 120
    revive:
      rules:
        - name: exported
          severity: warning
          disabled: true
        - name: unexported-return
          severity: warning
          disabled: false
        - name: var-naming
          severity: warning
          disabled: false
    unparam:
      check-exported: false
    exhaustive:
      default-signifies-exhaustive: true
  exclusions:
    generated: lax
    rules:
      # Same test-only relaxations as the architecture standard.
      - linters:
          - gosec
          - errcheck
          - unparam
        path: _test\.go
      # E2E specs are compiled into the binary and use .go, not _test.go.
      - linters:
          - errcheck
          - unparam
        path: ^e2e/.*\.go$
    paths:
      # Reserved for generated API clients; preserve the existing exclusion.
      - ^pkg/api(/|$)

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  new: false

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
  exclusions:
    generated: lax
    paths:
      - ^pkg/api(/|$)

output:
  formats:
    text:
      path: stdout
